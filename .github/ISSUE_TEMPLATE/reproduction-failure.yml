name: Reproduction failure
description: A script, result file or table value that you could not reproduce
labels: ["reproduction"]
body:
  - type: input
    id: commit
    attributes:
      label: Repository commit
      placeholder: "git rev-parse HEAD"
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: What you tried to reproduce
      placeholder: "experiments/results/e1_e5_complete.json key ..., or Table 2 cell ..."
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Exact command(s)
      render: shell
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, GPU and driver, Python version, `pip freeze` or `uv pip list`.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Value in the repo vs. value you got
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Full log or traceback
      render: text
